name: Build Windows Chrome Login

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-build-chatgpt.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bun install --frozen-lockfile
        working-directory: launcher

      - name: Enable system Chrome login on Windows
        shell: pwsh
        run: |
          function Replace-Exact {
            param(
              [string]$File,
              [string]$Old,
              [string]$New
            )

            $text = Get-Content -Path $File -Raw

            if (-not $text.Contains($Old)) {
              throw "Expected code not found in $File"
            }

            $text = $text.Replace($Old, $New)

            [System.IO.File]::WriteAllText(
              (Resolve-Path $File).Path,
              $text,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          # 1. Разрешаем захват сессии через обычный Chrome на Windows
          Replace-Exact `
            "src/browser-login.ts" `
            'if (process.platform !== "darwin") {' `
            'if (process.platform !== "darwin" && process.platform !== "win32") {'

          # 2. Разрешаем launcher-control login на Windows
          Replace-Exact `
            "src/cli.ts" `
            'if (process.platform !== "darwin") throw new Error("Passkey sign-in is currently supported only on macOS");' `
            'if (process.platform !== "darwin" && process.platform !== "win32") throw new Error("System-browser sign-in is currently supported only on macOS and Windows");'

          # 3. Разрешаем Launcher запускать Chrome-login на Windows
          Replace-Exact `
            "launcher/electron/runtime.cjs" `
            'if (this.platform !== "darwin") throw new Error("Passkey sign-in is currently supported only on macOS");' `
            'if (this.platform !== "darwin" && this.platform !== "win32") throw new Error("System-browser sign-in is currently supported only on macOS and Windows");'

          # 4. Показываем кнопку системного Chrome-login в Windows
          Replace-Exact `
            "launcher/src/App.tsx" `
            '    && platform === "darwin"' `
            '    && (platform === "darwin" || platform === "win32")'

          Write-Host "Windows system Chrome login patch applied."

      - name: Prepare Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV

      - name: Typecheck core
        run: bun run typecheck

      - name: Typecheck launcher
        run: bun run launcher:typecheck

      - name: Package
        run: bun run app:package

      - name: Smoke test
        run: bun run app:smoke

      - name: Archive runtime
        shell: pwsh
        run: Compress-Archive -Path launcher/build/runtime/* -DestinationPath codex-chatgpt-web-windows-chrome-login.zip

      - uses: actions/upload-artifact@v4
        with:
          name: codex-web-gpt-windows-CHROME-LOGIN
          path: |
            codex-chatgpt-web-windows-chrome-login.zip
            launcher/artifacts/*.exe
          if-no-files-found: error
          retention-days: 7
