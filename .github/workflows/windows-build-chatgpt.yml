name: Build Windows Browser Login

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-build-chatgpt.yml
      - scripts/patch-windows-browser-login.cjs

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bun install --frozen-lockfile
        working-directory: launcher

      - name: Patch Windows system-browser login
        run: bun scripts/patch-windows-browser-login.cjs

      - name: Prepare Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV

      - name: Typecheck core
        run: bun run typecheck

      - name: Typecheck launcher
        run: bun run launcher:typecheck

      - name: Package
        run: bun run app:package

      - name: Smoke test
        run: bun run app:smoke

      - name: Archive runtime
        shell: pwsh
        run: Compress-Archive -Path launcher/build/runtime/* -DestinationPath codex-chatgpt-web-windows-browser-login.zip

      - uses: actions/upload-artifact@v4
        with:
          name: codex-web-gpt-windows-BROWSER-LOGIN
          path: |
            codex-chatgpt-web-windows-browser-login.zip
            launcher/artifacts/*.exe
          if-no-files-found: error
          retention-days: 7
