name: Build Windows Browser Login

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/windows-build-chatgpt.yml

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      - run: bun install --frozen-lockfile
        working-directory: launcher

      - name: Enable system browser login on Windows
        shell: pwsh
        run: |
          function Replace-Exact {
            param(
              [string]$File,
              [string]$Old,
              [string]$New
            )

            $text = Get-Content -Path $File -Raw
            if (-not $text.Contains($Old)) {
              throw "Expected code not found in $File"
            }
            $text = $text.Replace($Old, $New)
            [System.IO.File]::WriteAllText(
              (Resolve-Path $File).Path,
              $text,
              [System.Text.UTF8Encoding]::new($false)
            )
          }

          Replace-Exact `
            "src/browser-login.ts" `
            'if (process.platform !== "darwin") {' `
            'if (process.platform !== "darwin" && process.platform !== "win32") {'

          Replace-Exact `
            "src/cli.ts" `
            'if (process.platform !== "darwin") throw new Error("Passkey sign-in is currently supported only on macOS");' `
            'if (process.platform !== "darwin" && process.platform !== "win32") throw new Error("System-browser sign-in is currently supported only on macOS and Windows");'

          $runtimePath = "launcher/electron/runtime.cjs"
          $runtime = Get-Content -Path $runtimePath -Raw
          $pattern = '(?ms)^  passkeyChromeExecutable\(\) \{.*?^  continuePasskeyLogin\(\) \{'
          $matches = [regex]::Matches($runtime, $pattern)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one passkeyChromeExecutable block, found $($matches.Count)"
          }

          $replacement = @'
  passkeyChromeExecutable() {
    if (this.platform !== "darwin" && this.platform !== "win32") {
      throw new Error("System-browser sign-in is currently supported only on macOS and Windows");
    }
    const setupConfig = this.supervisor.readSetupConfig
      ? this.supervisor.readSetupConfig()
      : this.supervisor.readConfig();
    const configured = setupConfig?.chromeExecutablePath;
    const yandex = this.platform === "win32" && process.env.LOCALAPPDATA
      ? path.join(process.env.LOCALAPPDATA, "Yandex", "YandexBrowser", "Application", "browser.exe")
      : null;
    const chrome = this.platform === "win32" && process.env.PROGRAMFILES
      ? path.join(process.env.PROGRAMFILES, "Google", "Chrome", "Application", "chrome.exe")
      : null;
    const edgeX86 = this.platform === "win32" && process.env["PROGRAMFILES(X86)"]
      ? path.join(process.env["PROGRAMFILES(X86)"], "Microsoft", "Edge", "Application", "msedge.exe")
      : null;
    const edge64 = this.platform === "win32" && process.env.PROGRAMFILES
      ? path.join(process.env.PROGRAMFILES, "Microsoft", "Edge", "Application", "msedge.exe")
      : null;
    const candidates = this.platform === "win32"
      ? [yandex, configured, chrome, edgeX86, edge64]
      : [configured, "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"];
    const candidate = candidates.find(value => usableExecutable(value, this.platform));
    if (!candidate) {
      throw new Error("No supported system browser was found");
    }
    return candidate;
  }

  continuePasskeyLogin() {
'@

          $runtime = [regex]::Replace($runtime, $pattern, $replacement, 1)
          [System.IO.File]::WriteAllText(
            (Resolve-Path $runtimePath).Path,
            $runtime,
            [System.Text.UTF8Encoding]::new($false)
          )

          Replace-Exact `
            "launcher/src/App.tsx" `
            '    && platform === "darwin"' `
            '    && (platform === "darwin" || platform === "win32")'

          Write-Host "Windows browser login patch applied (Yandex -> configured -> Chrome -> Edge)."

      - name: Prepare Windows runtime
        shell: pwsh
        run: ./scripts/prepare-windows-baseline-bun.ps1 -Version 1.4.0 -GitHubEnv $env:GITHUB_ENV

      - name: Typecheck core
        run: bun run typecheck

      - name: Typecheck launcher
        run: bun run launcher:typecheck

      - name: Package
        run: bun run app:package

      - name: Smoke test
        run: bun run app:smoke

      - name: Archive runtime
        shell: pwsh
        run: Compress-Archive -Path launcher/build/runtime/* -DestinationPath codex-chatgpt-web-windows-browser-login.zip

      - uses: actions/upload-artifact@v4
        with:
          name: codex-web-gpt-windows-BROWSER-LOGIN
          path: |
            codex-chatgpt-web-windows-browser-login.zip
            launcher/artifacts/*.exe
          if-no-files-found: error
          retention-days: 7
